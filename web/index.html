<!DOCTYPE html>
<html lang="ca" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meteo Penedès</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23f6a13a'/%3E%3Cpath d='M8 20a5 5 0 0 1 5-5 6 6 0 0 1 11 2 3.5 3.5 0 0 1-.5 7H10a3 3 0 0 1-2-4z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map" aria-label="Mapa de les estacions meteorològiques del Penedès, l'Anoia i el Garraf"></div>

<aside id="panel" class="panel">
  <button id="sheetHandle" class="sheet-handle" aria-label="Mostra o amaga el llistat"><span></span></button>
  <header class="brand">
    <div class="brand-row">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="28" height="28"><circle cx="12" cy="11" r="6" fill="#f6a13a"/><path d="M7 25a5 5 0 0 1 5-5 6 6 0 0 1 11 2 3.5 3.5 0 0 1-.5 7H10a3 3 0 0 1-3-4z" fill="#fff" opacity=".95"/></svg>
      </div>
      <div>
        <h1>Meteo Penedès</h1>
        <p class="sub"><span id="countOnline">–</span> estacions en línia</p>
      </div>
    </div>
    <div class="live" id="live" title="Actualitza automàticament cada minut">
      <span class="dot"></span><span id="liveText">Carregant…</span>
      <button id="refreshBtn" class="icon-btn" aria-label="Actualitza ara" title="Actualitza ara">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>
  </header>

  <div id="comarques" class="comarques" role="group" aria-label="Comarques"></div>
  <label id="deadRow" class="dead-row hidden"><input type="checkbox" id="deadToggle"><span id="deadLbl"></span></label>

  <nav id="tabs" class="tabs" role="tablist" aria-label="Variable meteorològica"></nav>

  <section class="summary" id="summary" aria-live="polite"></section>

  <section class="legend" id="legend" aria-label="Llegenda"></section>

  <div class="list-head">
    <input id="search" type="search" placeholder="Cerca estació o municipi…" autocomplete="off" aria-label="Cerca estació o municipi">
    <button id="sortBtn" class="chip-btn" title="Canvia l'ordre"></button>
  </div>
  <ul id="list" class="list" role="listbox" aria-label="Llistat d'estacions"></ul>
  <footer class="foot">Cercle: <a href="https://weathercloud.net" target="_blank" rel="noopener">Weathercloud</a> (estacions recollides per l'<a href="https://www.iepenedesencs.org/2018/meteo.php" target="_blank" rel="noopener">IEP</a>) · Quadrat: estació oficial del <a href="https://www.meteo.cat" target="_blank" rel="noopener">Servei Meteorològic de Catalunya</a> (XEMA, dades obertes)</footer>
</aside>

<div class="map-tools" id="mapTools">
  <div class="seg" id="baseSeg" role="group" aria-label="Mapa base">
    <button data-base="dark" class="on">Fosc</button>
    <button data-base="light">Clar</button>
    <button data-base="sat">Satèl·lit</button>
  </div>
  <button id="surfaceBtn" class="tool on" aria-pressed="true" title="Mostra la superfície interpolada">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 12 10 5 10-5"/><path d="m2 17 10 5 10-5"/></svg>
    <span class="lbl">Superfície</span>
  </button>
  <button id="radarBtn" class="tool" aria-pressed="false" title="Mostra o amaga el radar de pluja">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12 18 6"/></svg>
    <span class="lbl">Radar</span>
  </button>
  <button id="scaleBtn" class="tool" aria-pressed="false" title="Ajusta els colors al rang de valors actual">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12H3"/><path d="m7 8-4 4 4 4"/><path d="m17 8 4 4-4 4"/></svg>
    <span class="lbl">Escala ajustada</span>
  </button>
</div>

<div id="radarBar" class="radar-bar hidden">
  <button id="radarPlay" class="icon-btn" aria-label="Pausa"></button>
  <input id="radarRange" type="range" min="0" max="0" value="0" step="1" aria-label="Instant del radar">
  <div class="radar-time"><b id="radarTime">–</b><span id="radarAgo"></span></div>
  <span class="radar-src">Radar: <a href="https://www.rainviewer.com" target="_blank" rel="noopener">RainViewer</a></span>
</div>

<section id="detail"class="detail hidden" aria-live="polite"></section>

<div id="toast" class="toast hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="app.js"></script>
</body>
</html>
